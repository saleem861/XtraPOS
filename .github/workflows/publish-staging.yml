name: Publish to Staging (retired)

# Retired so it cannot duplicate CI or create a GitHub Environment.
# Packaging is .github/workflows/ci.yml.
# The blocked deployment gate is .github/workflows/deploy-staging.yml.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Retired. Type staging to see where packaging and deployment moved. This does not deploy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired publish
    if: github.event.inputs.confirm == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Stop
        run: |
          echo "::error::Publish to Staging is retired. It no longer installs dependencies, builds, uploads artifacts, or deploys. Use the CI workflow for the release artifact and Deploy to Staging for the blocked preflight. No host was contacted."
          exit 1
